<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0f9d58" />
    </linearGradient>
    <linearGradient id="bud-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>
  </defs>
  
  <!-- Antenna -->
  <line x1="50" y1="20" x2="50" y2="10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="8" r="4" fill="#0f9d58" />
  
  <!-- Head -->
  <rect x="25" y="20" width="50" height="40" rx="16" fill="url(#bud-bg)" />
  <rect x="25" y="20" width="50" height="40" rx="16" fill="url(#bud-glass)" />
  
  <!-- Face Screen -->
  <rect x="32" y="30" width="36" height="20" rx="6" fill="#0f172a" />
  
  <!-- Eyes -->
  <circle cx="40" cy="40" r="3" fill="#22c55e" />
  <circle cx="60" cy="40" r="3" fill="#22c55e" />
  
  <!-- Body -->
  <rect x="35" y="65" width="30" height="20" rx="10" fill="#e2e8f0" />
  <rect x="35" y="65" width="30" height="20" rx="10" fill="url(#bud-glass)" />
  
  <!-- Heart/Core -->
  <circle cx="50" cy="75" r="4" fill="#0f9d58" />
  
  <!-- Hover Rings -->
  <ellipse cx="50" cy="95" rx="15" ry="3" fill="#0f9d58" opacity="0.2" />
  <ellipse cx="50" cy="95" rx="8" ry="1.5" fill="#0f9d58" opacity="0.4" />
</svg>
