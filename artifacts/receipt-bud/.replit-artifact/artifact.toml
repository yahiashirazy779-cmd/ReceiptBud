kind = "web"
previewPath = "/"
title = "ReceiptBud"
version = "1.0.0"
id = "artifacts/receipt-bud"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25612

[services.development]
run = "pnpm --filter @workspace/receipt-bud run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/receipt-bud", "run", "build" ]
serve = "static"
publicDir = "artifacts/receipt-bud/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25612"
BASE_PATH = "/"
